name: Public repository boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test boundary rules
        run: bash scripts/check-public-boundary.sh --self-test

      - name: Check tracked paths
        run: bash scripts/check-public-boundary.sh
